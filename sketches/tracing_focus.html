<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Evidence Journey Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA; --surface:#FBF9F4; --sunk:#ECE8DE; --ink:#252826; --muted:#68706B; --faint:#979B94;
  --line:#D9D6CC; --pine:#557A68; --pine-soft:#E3EAE4; --steel:#6D8490; --steel-soft:#E3E8EA;
  --brass:#C08A3E; --brass-soft:#F4E8D3; --rust:#B85C50; --rust-soft:#F4E0DB; --paper:#FFFDF8;
  --plum:#8A6F8E; --plum-soft:#EFE7F0; color-scheme:light;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1E1C; --surface:#232623; --sunk:#181A18; --ink:#EAE7DE; --muted:#A5AAA3; --faint:#7D827C;
  --line:#383B35; --pine:#8DAE9C; --pine-soft:#27312B; --steel:#9CAFB8; --steel-soft:#252C30;
  --brass:#D4A664; --brass-soft:#352C1E; --rust:#D78A7E; --rust-soft:#3A2622; --paper:#262928;
  --plum:#B49BB8; --plum-soft:#30283A; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1E1C; --surface:#232623; --sunk:#181A18; --ink:#EAE7DE; --muted:#A5AAA3; --faint:#7D827C;
  --line:#383B35; --pine:#8DAE9C; --pine-soft:#27312B; --steel:#9CAFB8; --steel-soft:#252C30;
  --brass:#D4A664; --brass-soft:#352C1E; --rust:#D78A7E; --rust-soft:#3A2622; --paper:#262928;
  --plum:#B49BB8; --plum-soft:#30283A; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 40px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.top .note{font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.tbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 18px}
.count{font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--faint);min-height:1.2em;text-align:right}
.scroll{overflow-x:auto}
.scroll svg{width:100%;min-width:860px;height:auto;display:block}
.cap{margin:10px 0 0;min-height:1.6em;font-size:1.02rem}
.src{font:400 .72rem "IBM Plex Mono",monospace;color:var(--faint);margin:4px 0 0}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:12px}
.ctrl button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
svg .m{font:500 9.5px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;fill:var(--faint)}
svg .mb{font:600 10px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;fill:var(--ink)}
svg .t{font:600 17px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
svg .s{font:400 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
svg .h1{font:500 21px Fraunces,Georgia,serif;fill:var(--ink)}
svg .c{font:400 10.5px "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink);white-space:pre}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="note">Scratch sketch · Tracing, one stage at a time · not part of the site</span><button class="tbtn" id="theme">Theme</button></div>
  <div class="panel">
    <div class="count" id="count"></div>
    <div class="scroll"><svg id="sv" viewBox="0 0 1000 480" role="img" aria-label="Two checks followed through PlantMind one stage at a time, then traced back from the answer"></svg></div>
    <p class="cap" id="cap"></p>
    <p class="src">One real saved test run (3 Oct 2026), text shortened · the two checks come from the answer key (Evals lesson) · the ranking (8th) comes from a separate check of the same question</p>
    <div class="ctrl"><button id="play">▶ Play</button></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const lerp=(a,b,u)=>a+(b-a)*u;
const set=(id,at)=>{const e=$(id);if(e)for(const k in at)e.setAttribute(k,at[k]);};
const op=(id,v)=>set(id,{opacity:v});
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CW=6.3;   // monospace advance at 10.5px

/* ── the quiet map ── */
const STX=[100,256,412,568,724,880];
const STOP=[['Recorded','CHUNKING'],['Saved','EMBEDDING'],['Searched','RETRIEVAL'],['Put together','CONTEXT + PROMPT'],['AI received','MODEL INPUT'],['Wrote','GENERATION']];
const LANE={dv:[126,'steel'],f20:[138,'plum']};
const map=()=>`<g id="map">
 <line x1="${STX[0]}" x2="${STX[5]}" y1="74" y2="74" stroke="var(--line)" stroke-width="2"/>
 ${STOP.map(([n,b],i)=>`<g id="s${i}"><circle id="sc${i}" cx="${STX[i]}" cy="74" r="7" fill="var(--surface)" stroke="var(--faint)" stroke-width="1.6"/>
  <text id="sn${i}" class="mb" x="${STX[i]}" y="98" text-anchor="middle" style="fill:var(--muted)">${n.toUpperCase()}</text>
  <text class="m" x="${STX[i]}" y="111" text-anchor="middle" style="font-size:7.5px">${b}</text></g>`).join('')}
 ${Object.entries(LANE).map(([k,[y,c]])=>`<line x1="${STX[0]-40}" x2="${STX[5]}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2 4"/>
  <line id="l_${k}" x1="${STX[0]-40}" x2="${STX[0]-40}" y1="${y}" y2="${y}" stroke="var(--${c})" stroke-width="4" stroke-linecap="round"/>`).join('')}
 <g id="xf20" opacity="0"><circle cx="${STX[2]}" cy="${LANE.f20[0]}" r="7" fill="var(--rust)"/><text class="mb" x="${STX[2]}" y="${LANE.f20[0]+3.5}" text-anchor="middle" style="fill:var(--surface);font-size:9px">✗</text></g>
 <g id="xdv" opacity="0"><circle cx="${STX[5]}" cy="${LANE.dv[0]}" r="7" fill="var(--rust)"/><text class="mb" x="${STX[5]}" y="${LANE.dv[0]+3.5}" text-anchor="middle" style="fill:var(--surface);font-size:9px">✗</text></g>
 <circle id="cur" cx="${STX[5]}" cy="74" r="13" fill="none" stroke="var(--ink)" stroke-width="2" opacity="0"/></g>`;
const header=()=>`<text class="h1" x="30" y="30">PlantMind missed 2 checks</text>
 <rect x="560" y="16" width="12" height="12" rx="3" fill="var(--steel)"/><text class="s" x="578" y="27"><tspan style="font-weight:600">Dripping valves</tspan> · look for valves that drip</text>
 <rect x="560" y="36" width="12" height="12" rx="3" fill="var(--plum)"/><text class="s" x="578" y="47"><tspan style="font-weight:600">First 20 bottles</tspan> · weigh them: 495–505 ml</text>`;

/* ── the stage in front ── */
const PX=30,PY=160,PW=940,PH=310;
const stage=(id,title,badge)=>`<g id="${id}"><rect x="${PX}" y="${PY}" width="${PW}" height="${PH}" rx="14" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.3"/>
 <text class="t" x="${PX+22}" y="${PY+32}">${esc(title)}</text>
 ${badge?`<rect x="${PX+PW-22-badge.length*5.6-16}" y="${PY+18}" width="${badge.length*5.6+16}" height="18" rx="9" fill="var(--sunk)"/><text class="m" x="${PX+PW-22-(badge.length*5.6+16)/2}" y="${PY+31}" text-anchor="middle" style="font-size:8.5px;fill:var(--muted)">${badge}</text>`:''}`;
const quote=(x,y,txt,c,id='')=>`<g ${id?`id="${id}"`:''}><rect x="${x}" y="${y-13}" width="${txt.length*CW+16}" height="19" rx="3" fill="var(--${c}-soft)"/><rect x="${x}" y="${y-13}" width="4" height="19" fill="var(--${c})"/><text class="c" x="${x+10}" y="${y}">${esc(txt)}</text></g>`;
const gapq=(x,y,w,txt,id='')=>`<g ${id?`id="${id}"`:''}><rect x="${x}" y="${y-13}" width="${w}" height="19" rx="3" fill="none" stroke="var(--rust)" stroke-dasharray="4 3"/><text class="c" x="${x+10}" y="${y}" style="fill:var(--rust)">${esc(txt)}</text></g>`;
const tile=(x,y,w,h,c,strong)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="4" fill="var(--paper)" stroke="${c?`var(--${c})`:'var(--faint)'}" stroke-width="${strong?2:1}"/>${[0,1,2,3].map(j=>`<rect x="${x+6}" y="${y+8+j*8}" width="${w-12-(j%2)*10}" height="3" rx="1.5" fill="${c&&j===1?`var(--${c})`:'var(--line)'}"/>`).join('')}`;
const DVQ='“A valve drips between fills”', F20Q='“weigh the first 20 bottles … between 495 and 505 ml”';

// 1 · recorded + saved
const b1=()=>`${stage('b1','What was recorded and saved?','CHUNKING · EMBEDDING + METADATA')}
 <g id="b1d"><rect x="60" y="214" width="96" height="140" rx="6" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.2"/><text class="mb" x="70" y="232" style="font-size:8px">WI-FL101-001</text>
  ${[...Array(12)].map((_,k)=>`<rect x="70" y="${242+k*9}" width="${76-(k%3)*12}" height="3" rx="1.5" fill="var(--line)"/>`).join('')}</g>
 <path id="b1a" d="M162,284 H196" stroke="var(--faint)" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
 <g id="b1t">${[...Array(8)].map((_,k)=>tile(206+(k%4)*66,214+Math.floor(k/4)*64,56,52,k===1?'steel':k===4?'plum':null,k===1||k===4)).join('')}
  <text class="m" x="206" y="352" style="font-size:8.5px">8 CHUNKS · THE TWO LINES SIT IN CHUNKS 2 AND 5</text></g>
 ${quote(206,384,DVQ,'steel','b1q1')}${quote(206,412,F20Q,'plum','b1q2')}
 <g id="b1f"><text class="m" x="700" y="226">FILED UNDER</text>
  <rect x="700" y="236" width="70" height="20" rx="10" fill="var(--pine-soft)" stroke="var(--pine)"/><text class="mb" x="735" y="250" text-anchor="middle" style="fill:var(--pine);font-size:9px">FL-101</text>
  <rect x="778" y="236" width="150" height="20" rx="10" fill="var(--pine-soft)" stroke="var(--pine)"/><text class="mb" x="853" y="250" text-anchor="middle" style="fill:var(--pine);font-size:9px">WORK INSTRUCTION</text>
  <text class="s" x="700" y="290" style="fill:var(--muted)">Both lines are on file, in one</text><text class="s" x="700" y="308" style="fill:var(--muted)">piece, under the right machine.</text></g></g>`;

// 2 · search
const SL=[['#1','0.87','10 Sept night','“Valves 9 and 15 dripping…”','steel'],['#2','0.86','17 Sept day','',null],['#3','0.85','1 Sept day','',null],['#4','0.85','21 Sept night','',null]];
const WL=[['#1','0.86','header','',null],['#2','0.85','when to replace',DVQ,'steel'],['#3','0.83','troubleshooting','',null],['#4','0.82','steps 1–8','',null]];
const list=(x,head,rows,pre)=>`<text class="m" x="${x}" y="${PY+64}">${head}</text>${rows.map(([r,s,n,q,c],i)=>{const y=PY+88+i*28;return `<g id="${pre}${i}">
 ${c?`<rect x="${x-6}" y="${y-15}" width="412" height="22" rx="4" fill="var(--${c}-soft)"/><rect x="${x-6}" y="${y-15}" width="4" height="22" fill="var(--${c})"/>`:''}
 <text class="mb" x="${x}" y="${y}">${r}</text><text class="c" x="${x+30}" y="${y}" style="fill:var(--muted)">${s}</text><text class="c" x="${x+70}" y="${y}">${esc(n)}</text>
 ${q?`<text class="c" x="${x+400}" y="${y}" text-anchor="end" style="fill:var(--${c})">${esc(q)}</text>`:''}</g>`;}).join('')}`;
const b2=()=>`${stage('b2','What did search find?','RETRIEVAL + RANKING')}
 ${list(60,'SEARCH 1 · SHIFT LOGS',SL,'b2s')}${list(520,'SEARCH 2 · WORK INSTRUCTION',WL,'b2w')}
 <g id="b2c"><line x1="50" x2="950" y1="${PY+196}" y2="${PY+196}" stroke="var(--ink)" stroke-width="1.8" stroke-dasharray="7 4"/>
  <text class="mb" x="940" y="${PY+212}" text-anchor="end" style="font-size:9px">▲ ONLY THE BEST 4 OF EACH SEARCH GO ON</text></g>
 <text id="b2r" class="c" x="526" y="${PY+238}" style="fill:var(--faint)">#5–7  other chunks</text>
 <g id="b2e"><rect x="514" y="${PY+251}" width="412" height="24" rx="4" fill="var(--plum-soft)" stroke="var(--rust)" stroke-width="1.4"/>
  <text class="mb" x="520" y="${PY+267}">#8</text><text class="c" x="590" y="${PY+267}">steps 9–10 · first-bottle check</text>
  <text class="mb" x="918" y="${PY+267}" text-anchor="end" style="fill:var(--rust);font-size:9px">✗ LEFT BEHIND</text></g></g>`;

// 3 · put together + received
const b3=()=>`${stage('b3','What went in?','CONTEXT + PROMPT · MODEL INPUT')}
 <g id="b3t"><text class="m" x="60" y="${PY+64}">7 OF THE 8 CHUNKS FIT</text>
  ${[...Array(7)].map((_,k)=>tile(60+(k%4)*66,PY+76+Math.floor(k/4)*64,56,52,k===0||k===5?'steel':null,k===0||k===5)).join('')}</g>
 <g id="b3i"><rect x="60" y="${PY+214}" width="254" height="58" rx="8" fill="var(--brass-soft)" stroke="var(--brass)"/>
  <text class="m" x="72" y="${PY+232}" style="font-size:8.5px;fill:var(--brass)">+ THE INSTRUCTIONS · REPORT TEMPLATE</text>
  <text class="c" x="72" y="${PY+254}" style="font-size:9.5px">Step 4: Verify — … procedure requires</text></g>
 <path id="b3a" d="M340,${PY+170} H420" stroke="var(--faint)" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
 <g id="b3r"><rect x="430" y="${PY+58}" width="510" height="214" rx="10" fill="var(--sunk)" stroke="var(--line)"/>
  <text class="m" x="448" y="${PY+80}">WHAT PLANTMIND READ</text>
  ${quote(448,PY+118,DVQ,'steel')}<text class="mb" x="922" y="${PY+118}" text-anchor="end" style="fill:var(--pine)">✓ IN</text>
  ${gapq(448,PY+158,370,'no 495–505 ml, no first-20-bottles step')}<text class="mb" x="922" y="${PY+158}" text-anchor="end" style="fill:var(--rust)">✗ NOT IN</text>
  <text class="s" x="448" y="${PY+204}" style="fill:var(--muted)">The dripping-valves line went in, twice: from the</text>
  <text class="s" x="448" y="${PY+222}" style="fill:var(--muted)">work instruction and from a shift log.</text></g></g>`;

// 4 · wrote
const ANS=['Step 1: Safety — Press STOP and apply LOTO to FL-101','Step 2: Diagnosis — Identify the specific valve(s) with underfill…','Step 3: Fix — Replace the seal kit on each affected valve…','Step 4: Verify — Run a test batch, check the checkweigher…','Step 5: Quality — Quarantine any bottles produced…'];
const AY=[PY+92,PY+118,PY+182,PY+208,PY+234];
const b4=()=>`${stage('b4','What did the AI write?','GENERATION')}
 <g id="b4g"><text class="m" x="60" y="${PY+64}">IT WAS GIVEN</text>${quote(60,PY+96,DVQ,'steel')}
  <text class="s" x="60" y="${PY+136}" style="fill:var(--muted)">and 6 other chunks, plus</text><text class="s" x="60" y="${PY+154}" style="fill:var(--muted)">the report instructions</text></g>
 <path id="b4a" d="M330,${PY+92} H372" stroke="var(--faint)" stroke-width="1.6" fill="none" marker-end="url(#ah)"/>
 <text class="m" x="384" y="${PY+64}">IT WROTE</text>
 ${ANS.map((l,i)=>`<text id="b4l${i}" class="c" x="384" y="${AY[i]}"></text>`).join('')}
 ${gapq(384,PY+150,456,'no “look for dripping valves” step','b4x')}
 <text id="b4n" class="s" x="384" y="${PY+278}" style="fill:var(--rust)">It had the dripping-valves line, and didn’t write it.</text></g>`;

// 5 · walk back from the answer
const BK=[[5,'rust','Wrote','Dripping valves was given, and not written.'],[2,'rust','Searched','First 20 bottles: its chunk came 8th and was left behind.'],[0,'pine','Recorded','Both lines were on file from the start.']];
const b5=()=>`${stage('b5','Walk back from the answer','TRACE EVALUATION')}
 ${BK.map(([s,c,n,txt],i)=>{const y=PY+84+i*52;return `<g id="b5r${i}"><circle cx="72" cy="${y-5}" r="11" fill="var(--${c})"/><text class="mb" x="72" y="${y-1}" text-anchor="middle" style="fill:var(--surface)">${c==='rust'?'✗':'✓'}</text>
  <text class="mb" x="96" y="${y}" style="font-size:11px">${s+1} · ${n.toUpperCase()}</text><text class="s" x="240" y="${y}">${esc(txt)}</text></g>`;}).join('')}
 <g id="b5c"><line x1="60" x2="940" y1="${PY+234}" y2="${PY+234}" stroke="var(--line)"/>
  <text class="t" x="60" y="${PY+270}" style="font-size:16px">Two checks, lost in two places: at search, and in the writing.</text>
  <text class="s" x="60" y="${PY+292}" style="fill:var(--muted)">Each needs a different fix: better ranking for one, a check on the written answer for the other.</text></g></g>`;

const build=()=>`<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker></defs>
 ${header()}${map()}${b1()}${b2()}${b3()}${b4()}${b5()}`;

/* ── timeline: five beats forward, then walk back ── */
const BT=[[0,.14],[.14,.38],[.38,.52],[.52,.76],[.76,1]];
const BEATSTOPS=[[0,1],[2],[3,4],[5],[]];
const CAPS=['Recorded and saved: both lines are in the work instruction, each in one chunk, filed under the right machine.',
 'Search: two searches, the best 4 of each go on. The dripping-valves line makes it. The first-20-bottles chunk comes 8th and is left behind.',
 'What went in: 7 of the 8 chunks fit, with the report instructions. The dripping-valves line is in. The first-20-bottles step is not.',
 'Writing: PlantMind writes the answer. It had the dripping-valves line, and the answer never mentions it.',
 'Now walk back from the answer: the first place each check is missing tells you where to look. Two problems, two different fixes.'];
function render(t){
 const bi=BT.findIndex(([a,b])=>t>=a&&t<b);const B=bi<0?4:bi;
 BT.forEach(([a,b],i)=>op('b'+(i+1),i===4?seg(t,a,a+.02):seg(t,a,a+.02)*(1-seg(t,b-.015,b))));
 // map: stops passed are filled, current ones are dark
 const passed=BEATSTOPS.slice(0,B).flat(),now=BEATSTOPS[B]||[];
 STOP.forEach((_,i)=>{const on=now.includes(i),done=passed.includes(i)||B===4;
  set('sc'+i,{fill:on?'var(--ink)':done?'var(--line)':'var(--surface)',stroke:on?'var(--ink)':'var(--faint)',r:on?9:7});$('sn'+i).style.fill=on?'var(--ink)':'var(--muted)';});
 // lanes grow beat by beat; first 20 stops at Searched, dripping valves at Wrote
 const reach=k=>{const ends=[STX[1],STX[2],STX[4],STX[5],STX[5]];const prev=[STX[0]-40,...ends];return lerp(prev[k],ends[k],seg(t,BT[k][0]+.02,BT[k][1]-.03));};
 const dvX=B===0?reach(0):B===1?reach(1):B===2?reach(2):reach(3);
 const f20X=B===0?reach(0):Math.min(STX[2],reach(Math.min(B,1)));
 set('l_dv',{x2:B===4?STX[5]:dvX});set('l_f20',{x2:B>=2?STX[2]:f20X});
 op('xf20',seg(t,.3,.33));op('xdv',seg(t,.7,.73));
 // beat contents
 op('b1d',seg(t,.01,.03));op('b1a',seg(t,.03,.04));op('b1t',seg(t,.04,.06));op('b1q1',seg(t,.06,.08));op('b1q2',seg(t,.08,.1));op('b1f',seg(t,.1,.12));
 SL.forEach((_,i)=>op('b2s'+i,seg(t,.16+i*.012,.18+i*.012)));WL.forEach((_,i)=>op('b2w'+i,seg(t,.17+i*.012,.19+i*.012)));
 op('b2c',seg(t,.23,.25));op('b2r',seg(t,.25,.26));
 {const u=seg(t,.26,.31);set('b2e',{transform:`translate(0,${lerp(-200,0,u)})`,opacity:seg(t,.255,.265)});}
 op('b3t',seg(t,.39,.41));op('b3i',seg(t,.41,.43));op('b3a',seg(t,.43,.44));op('b3r',seg(t,.44,.46));
 op('b4g',seg(t,.53,.55));op('b4a',seg(t,.55,.56));
 {const tot=ANS.join('').length,n=Math.floor(tot*clamp((t-.56)/.1));let used=0;ANS.forEach((l,i)=>{$('b4l'+i).textContent=l.slice(0,Math.max(0,n-used));used+=l.length;});}
 op('b4x',seg(t,.67,.69));op('b4n',seg(t,.7,.72));
 // walk back: the ring travels from Wrote to Recorded
 {const u=seg(t,.79,.9);const x=u<.5?lerp(STX[5],STX[2],u*2):lerp(STX[2],STX[0],(u-.5)*2);set('cur',{cx:x,opacity:t>.78&&t<.93?1:0});

const DUR=44000,PAUSE=7000;let raf=0,t0=0,playing=false;

function loop(){const e=performance.now()-t0;

 else{$('count').textContent='';const t=clamp((e-PAUSE)/DUR);render(t);if(t>=1){playing=false;$('play').textContent='▶ Replay';return;}}
