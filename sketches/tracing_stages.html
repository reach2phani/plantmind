<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracing Sketch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F2EA; --surface:#FBF9F4; --sunk:#ECE8DE; --ink:#252826; --muted:#68706B; --faint:#979B94;
  --line:#D9D6CC; --pine:#557A68; --pine-soft:#E3EAE4; --steel:#6D8490; --steel-soft:#E3E8EA;
  --brass:#C08A3E; --brass-soft:#F4E8D3; --rust:#B85C50; --rust-soft:#F4E0DB; --paper:#FFFDF8; color-scheme:light;}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#1C1E1C; --surface:#232623; --sunk:#181A18; --ink:#EAE7DE; --muted:#A5AAA3; --faint:#7D827C;
  --line:#383B35; --pine:#8DAE9C; --pine-soft:#27312B; --steel:#9CAFB8; --steel-soft:#252C30;
  --brass:#D4A664; --brass-soft:#352C1E; --rust:#D78A7E; --rust-soft:#3A2622; --paper:#262928; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#1C1E1C; --surface:#232623; --sunk:#181A18; --ink:#EAE7DE; --muted:#A5AAA3; --faint:#7D827C;
  --line:#383B35; --pine:#8DAE9C; --pine-soft:#27312B; --steel:#9CAFB8; --steel-soft:#252C30;
  --brass:#D4A664; --brass-soft:#352C1E; --rust:#D78A7E; --rust-soft:#3A2622; --paper:#262928; color-scheme:dark;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto;padding:24px 16px 40px}
.top{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.top .note{font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--faint);text-transform:uppercase}
.tbtn{margin-left:auto;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:7px;padding:5px 10px;font:inherit;font-size:.8rem;cursor:pointer}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px 24px 18px}
.kick{font-family:"IBM Plex Mono",monospace;font-size:.75rem;letter-spacing:.07em;text-transform:uppercase;color:var(--faint)}
.title{font:500 clamp(1.3rem,2.5vw,1.7rem)/1.3 Fraunces,Georgia,serif;margin:4px 0 8px}
.lead{max-width:76ch;color:var(--muted);margin:0 0 6px}
.count{font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.06em;color:var(--faint);min-height:1.2em;text-align:right}
.scroll{overflow-x:auto}
.scroll svg{width:100%;min-width:860px;height:auto;display:block}
.real{margin-top:10px;background:var(--sunk);border-radius:10px;padding:12px 14px;display:flex;gap:14px;opacity:0;transition:opacity .5s}
.real.on{opacity:1}
.real .n{font:500 .72rem "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:var(--pine);flex:none;width:104px;padding-top:3px}
.real p{margin:0;font-size:.95rem}
.real small{display:block;margin-top:4px;font:400 .72rem "IBM Plex Mono",monospace;color:var(--faint)}
.ctrl{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap}
.ctrl button{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 12px;font:inherit;font-size:.85rem;cursor:pointer}
.dots{display:flex;gap:6px;margin-left:8px}
.dots i{width:9px;height:9px;border-radius:50%;background:var(--line);cursor:pointer}
.dots i.on{background:var(--ink)}
svg .m{font:500 10px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;fill:var(--faint)}
svg .mb{font:600 10px "IBM Plex Mono",ui-monospace,monospace;letter-spacing:.06em;fill:var(--ink)}
svg .s{font:400 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
svg .q{font:italic 400 13px "IBM Plex Sans",system-ui,sans-serif;fill:var(--ink)}
svg .code{font:400 9.5px "IBM Plex Mono",ui-monospace,monospace;fill:var(--ink);white-space:pre}
@media (prefers-reduced-motion:reduce){.real{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="note">Scratch sketch · Tracing · not part of the site</span><button class="tbtn" id="theme">Theme</button></div>
  <div class="panel">
    <div class="kick" id="kick"></div>
    <div class="title" id="title"></div>
    <p class="lead" id="lead"></p>
    <div class="count" id="count"></div>
    <div class="scroll"><svg id="sv" viewBox="0 0 1000 480" role="img" aria-label="Tracing animation"></svg></div>
    <div class="real" id="real"><div class="n">In PlantMind</div><p id="realt"></p></div>
    <div class="ctrl"><button id="prev">←</button><button id="play">▶ Play</button><button id="next">→</button><div class="dots" id="dots"></div></div>
  </div>
</div>
<script>
(function(){
const $=id=>document.getElementById(id);
const clamp=v=>Math.max(0,Math.min(1,v));
const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const seg=(t,a,b)=>ease(clamp((t-a)/(b-a)));
const lerp=(a,b,u)=>a+(b-a)*u;
const set=(id,at)=>{const e=$(id);if(e)for(const k in at)e.setAttribute(k,at[k]);};
const op=(id,v)=>set(id,{opacity:v});
const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CW=5.7, LH=17;   // monospace advance at 9.5px, line height
const DEFS=`<defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="context-stroke"/></marker>
 <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="var(--line)" stroke-width="2"/></pattern></defs>`;
const chip=(x,y,t,c='pine',fs=9.5)=>{const w=t.length*fs*.64+14;return `<rect x="${x}" y="${y-12}" width="${w}" height="17" rx="8.5" fill="var(--${c}-soft)" stroke="var(--${c})"/><text class="mb" x="${x+7}" y="${y}" style="fill:var(--${c});font-size:${fs}px">${esc(t)}</text>`;};

/* ── the pipeline strip (same on every step) ── */
const ST=[['CHUNKING','STORED DATA'],['EMBED & STORE','STORED DATA'],['SEARCH & RANK','IN THE TRACE'],['HANDED TO THE AI','IN THE TRACE'],['SYSTEM PROMPT','NOT IN THE TRACE'],['ANSWER','IN THE TRACE']];
const SX=[95,235,420,575,730,885];
const strip=(active,verdicts)=>`<g>
 <text class="m" x="30" y="20">AT UPLOAD</text><text class="m" x="335" y="20">WHEN A QUESTION IS ASKED</text>
 <line x1="318" y1="10" x2="318" y2="92" stroke="var(--line)" stroke-dasharray="3 4"/>
 <line x1="${SX[0]}" y1="44" x2="${SX[1]}" y2="44" stroke="var(--line)" stroke-width="2"/>
 <line x1="${SX[2]}" y1="44" x2="${SX[5]}" y2="44" stroke="var(--line)" stroke-width="2"/>
 <path d="M${SX[1]+14},44 C290,44 350,44 ${SX[2]-14},44" fill="none" stroke="var(--line)" stroke-width="2" stroke-dasharray="4 4"/>
 ${ST.map(([n,w],i)=>{const on=i===active,v=verdicts&&verdicts[i];const c=v==='ok'?'pine':v==='bad'?'rust':null;
  const fill=c?`var(--${c})`:on?'var(--ink)':'var(--surface)',stroke=c?`var(--${c})`:on?'var(--ink)':'var(--line)';
  const wc=w==='IN THE TRACE'?'var(--steel)':w==='NOT IN THE TRACE'?'var(--brass)':'var(--faint)';
  return `<g id="sn${i}"><circle cx="${SX[i]}" cy="44" r="${on?9:7}" fill="${fill}" stroke="${stroke}" stroke-width="2"/>${on?`<circle cx="${SX[i]}" cy="44" r="14" fill="none" stroke="var(--steel-soft)" stroke-width="5"/>`:''}
  <text class="${on?'mb':'m'}" x="${SX[i]}" y="70" text-anchor="middle" style="${on?'':'fill:var(--muted)'}">${n}</text>
  <text class="m" x="${SX[i]}" y="86" text-anchor="middle" style="font-size:8.5px;fill:${wc}">${w==='IN THE TRACE'?'◉ ':w==='NOT IN THE TRACE'?'○ ':''}${w}</text></g>`;}).join('')}</g>`;

/* ── a text panel you can search: find bar, scan line, highlighted matches, counter ── */
const P={};
function panel(id,x,y,w,head,lines,term,o={}){
  const top=y+(term?64:50),h=o.h||((term?74:60)+lines.length*LH),tx=x+14,re=term?new RegExp(term.replace(/[-]/g,'[-‑]'),'gi'):null,hits=[];
  let body='';
  lines.forEach((l,i)=>{const ly=top+i*LH;const faded=o.cutLine!=null&&(i>o.cutLine||(i===o.cutLine));
    if(re){let m;re.lastIndex=0;while((m=re.exec(l))){const k=hits.length;hits.push({i,y:ly});
      body+=`<rect id="${id}h${k}" x="${tx+m.index*CW-1}" y="${ly-11}" width="${m[0].length*CW+2}" height="14" rx="2" fill="var(--brass-soft)" stroke="var(--brass)" stroke-width=".8" opacity="0"/>`;}}
    if(o.cutLine!=null&&i===o.cutLine){const a=l.slice(0,o.cutCol),b=l.slice(o.cutCol);
      body+=`<text class="code" x="${tx}" y="${ly}" xml:space="preserve">${esc(a)}<tspan id="${id}fd${i}">${esc(b)}</tspan></text>`;}
    else body+=`<text id="${id}l${i}" class="code" x="${tx}" y="${ly}" xml:space="preserve" style="${o.dim&&o.dim(i)?'fill:var(--muted)':''}">${esc(l)}</text>`;});
  let cut='';
  if(o.cutLine!=null){const cy=top+o.cutLine*LH,cx=tx+o.cutCol*CW;
    cut=`<g id="${id}cut" opacity="0"><path d="M${x},${cy+4} H${cx} V${cy-12} H${x+w}" fill="none" stroke="var(--rust)" stroke-width="1.6" stroke-dasharray="5 3"/>
     <text class="mb" x="${x+w-8}" y="${cy-16}" text-anchor="end" style="fill:var(--rust);font-size:9px">▲ CHARACTER 300 · THE AI GOT ONLY THIS PART</text></g>`;}
  P[id]={top,bottom:top+(lines.length-1)*LH+6,hits,lines:lines.length,cutLine:o.cutLine};
  return `<g id="${id}"><rect id="${id}bx" x="${x}" y="${y}" width="${w}" height="${h}" rx="10" fill="var(--paper)" stroke="var(--line)" stroke-width="1.4"/>
   <text class="mb" x="${x+14}" y="${y+20}" style="font-size:9.5px">${esc(head)}</text>
   ${o.sub?`<text class="m" x="${x+14}" y="${y+34}" style="font-size:8.5px">${esc(o.sub)}</text>`:''}
   ${term?`<g id="${id}fb"><rect x="${x+w-150}" y="${y+8}" width="138" height="22" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.2"/>
    <circle cx="${x+w-136}" cy="${y+18}" r="4.5" fill="none" stroke="var(--ink)" stroke-width="1.4"/><line x1="${x+w-133}" y1="${y+21}" x2="${x+w-129}" y2="${y+25}" stroke="var(--ink)" stroke-width="1.4"/>
    <text id="${id}tm" class="code" x="${x+w-122}" y="${y+23}" style="font-size:10px"></text></g>
    <text id="${id}ct" class="mb" x="${x+w-12}" y="${y+44}" text-anchor="end" style="font-size:9.5px"></text>`:''}
   ${body}${cut}
   <line id="${id}sc" x1="${x+6}" x2="${x+w-6}" y1="${top}" y2="${top}" stroke="var(--steel)" stroke-width="2" opacity="0"/></g>`;
}
// type the term (a), scan (b), show the count; returns number of hits revealed
function scan(id,term,t,a,b,countText){
  const p=P[id],tu=seg(t,a,a+.06),u=clamp((t-a-.06)/(b-a-.06));
  $(id+'tm').textContent=term.slice(0,Math.round(term.length*tu));
  const y=lerp(p.top-12,p.bottom,u);
  set(id+'sc',{y1:y,y2:y,opacity:u>0&&u<1?.9:0});
  let n=0;p.hits.forEach((h,k)=>{const on=u>0&&y>=h.y-11;op(id+'h'+k,on?1:0);if(on)n++;});
  $(id+'ct').textContent=u>0?(countText?countText(n,u>=1):`${n} match${n===1?'':'es'}`):'';
  return n;
}
const verdict=(id,good)=>set(id+'bx',{stroke:good==null?'var(--line)':good?'var(--pine)':'var(--rust)','stroke-width':good==null?1.4:2.2});

/* ── the steps ── */
const ANSWER=['Step 1: Safety — Press STOP (normal stop), then perform LOTO','        per SAF-003 before any inspection or repair.','Step 2: Diagnosis — Read the checkweigher report to identify','        which valve numbers are underfilling…','Step 3: Fix — If a valve drips, replace its seal kit (SEAL-FV-24)','        following WI-FL101-001 steps 1-10…','Step 4: Verify — Run the first-bottle check (20 bottles,','        495-505 ml)…','Step 5: Quality — Quarantine any bottles already rejected by','        the checkweigher; record seal replacement details…'];
const S=[];

/* 0 · the symptom */
S.push({kick:'The symptom',title:'A required step is missing from the answer',
 lead:'The operator asks the same question you saw in How it works. The answer looks complete, but the test’s answer key says one step is missing: the 10-minute sanitation rinse after a seal change. Before fixing anything, we need to know where it was lost.',
 real:'Caught by the test’s answer key (evals). The app has no live check for missing steps. Question FL-01, saved run 3, 30 Sept 2026.',
 src:'evals/graph_value/fl101_runs.jsonl · fl101_scorecard.md',dur:9000,
 build:()=>`${strip(-1)}
  <text class="m" x="40" y="120">OPERATOR’S QUESTION</text>
  <g id="q0"><circle cx="58" cy="150" r="9" fill="var(--ink)"/><path d="M42,178 C42,162 74,162 74,178 Z" fill="var(--ink)"/>
   <rect x="90" y="130" width="370" height="76" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
   <text class="q" x="106" y="155">getting underfill alarms again for the third time</text><text class="q" x="106" y="174">tonight and checkweigher is rejecting them.</text><text class="q" x="106" y="193">what should i check?</text></g>
  <g id="k0"><rect x="40" y="270" width="420" height="96" rx="10" fill="var(--surface)" stroke="var(--brass)" stroke-width="1.5"/>
   <text class="mb" x="56" y="292" style="fill:var(--brass)">THE TEST’S ANSWER KEY SAYS</text>
   <text class="s" x="56" y="318">Required: 10-minute sanitation rinse</text><text class="s" x="56" y="337">after the seal change.</text>
   <text class="m" x="56" y="356" style="font-size:8.5px">checked in testing · no live check in the app</text></g>
  <path id="ar0" d="M462,318 H492" stroke="var(--brass)" stroke-width="1.5" fill="none" marker-end="url(#ah)"/>
  ${panel('a0',500,112,470,'THE ANSWER · HOW TO ADDRESS IT',ANSWER,null,{sub:'shortened · saved run 3'})}
  <g id="st0" transform="translate(735,388) rotate(-6)"><rect x="-108" y="-17" width="216" height="30" rx="5" fill="var(--rust-soft)" stroke="var(--rust)" stroke-width="2"/>
   <text class="mb" x="0" y="3" text-anchor="middle" style="fill:var(--rust);font-size:12px">MISSING · 10-MIN RINSE</text></g>`,
 render(t){op('q0',seg(t,0,.12));op('a0',seg(t,.14,.3));op('k0',seg(t,.42,.55));op('ar0',seg(t,.56,.64));op('st0',seg(t,.7,.8));verdict('a0',t>.75?false:null);}});

/* 1 · chunking */
const WI5=['Step 9 — SANITATION RINSE — MANDATORY','         Run the sanitation rinse for 10 minutes. This removes lubricant','         and any particles from the new seals. Never skip this step: the','         first bottles would carry lubricant into the product.','','Step 10 — FIRST-BOTTLE CHECK — MANDATORY','         Run at normal speed and weigh the first 20 bottles.','         All 20 must be between 495 and 505 ml.','…'];
S.push({kick:'Stage 1 of 6 · Chunking · checked in the stored data',title:'Is the fact inside a stored chunk, in one piece?',
 lead:'Start with the first question an engineer asks: was the fact ever in the system? Open the stored chunks of the work instruction and search for it. If a step were split across two chunks, search could find half of it and miss the rest.',
 real:'The rinse is whole inside chunk 5 of the work instruction’s 8 chunks. In our tests, every lost fact we traced was still in the stored chunks, so chunking wasn’t where facts were lost. The trace doesn’t cover this stage: you check it by opening what was stored.',
 src:'demo_data/fl101/FL-101-Work-Instruction.txt, split with the app’s own settings · evals/context/attribution.md',dur:10000,
 build:()=>`${strip(0)}
  <g id="d1"><rect x="40" y="118" width="110" height="160" rx="7" fill="var(--paper)" stroke="var(--ink)" stroke-width="1.4"/>
   <text class="mb" x="52" y="138" style="font-size:8.5px">WI-FL101-001</text>
   ${[...Array(7)].map((_,k)=>`<rect x="52" y="${152+k*16}" width="${86-(k%3)*14}" height="5" rx="2.5" fill="var(--line)"/>`).join('')}</g>
  <path id="ar1" d="M156,198 H190" stroke="var(--faint)" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
  <text class="m" x="200" y="124">8 STORED CHUNKS</text>
  ${[...Array(8)].map((_,k)=>{const x=200+(k%4)*62,y=134+Math.floor(k/4)*78,hl=k===4;return `<g id="c1${k}"><rect x="${x}" y="${y}" width="52" height="66" rx="5" fill="var(--paper)" stroke="${hl?'var(--steel)':'var(--faint)'}" stroke-width="${hl?2:1}"/>
   ${[0,1,2,3].map(j=>`<rect x="${x+7}" y="${y+12+j*11}" width="${36-(j%2)*10}" height="3" rx="1.5" fill="var(--line)"/>`).join('')}
   <text class="m" x="${x+26}" y="${y+60}" text-anchor="middle" style="font-size:8px;${hl?'fill:var(--steel);font-weight:600':''}">${k+1}</text></g>`;}).join('')}
  <path id="lk1" d="M${200+62+52},${212+20} C400,${250} 430,${200} 480,${180}" fill="none" stroke="var(--steel)" stroke-width="1.3" stroke-dasharray="4 3"/>
  <g id="w1"><text class="m" x="40" y="330" style="fill:var(--brass)">WHAT CAN GO WRONG · ILLUSTRATIVE</text>
   <rect x="40" y="340" width="190" height="56" rx="6" fill="var(--paper)" stroke="var(--faint)"/><text class="code" x="50" y="372" xml:space="preserve">…Step 9 — SANITATION</text>
   <rect x="242" y="340" width="190" height="56" rx="6" fill="var(--paper)" stroke="var(--faint)"/><text class="code" x="252" y="372" xml:space="preserve">RINSE — Run the rinse…</text>
   <line x1="236" y1="334" x2="236" y2="402" stroke="var(--rust)" stroke-width="2" stroke-dasharray="4 3"/>
   <text class="s" x="40" y="424" style="font-size:12px;fill:var(--muted)">A step split across two chunks: search may find only half.</text></g>
  ${panel('p1',480,112,490,'OPEN STORED CHUNK 5 OF 8',WI5,'rinse',{sub:'real text · work instruction'})}
  <g id="v1">${chip(494,370,'✓ THE RINSE STEP IS WHOLE, INSIDE ONE CHUNK','pine')}</g>`,
 render(t){op('d1',seg(t,0,.08));op('ar1',seg(t,.08,.12));for(let k=0;k<8;k++)op('c1'+k,seg(t,.1+k*.015,.16+k*.015));
  op('lk1',seg(t,.28,.34));op('p1',seg(t,.3,.38));const n=scan('p1','rinse',t,.42,.72);op('v1',seg(t,.76,.82));verdict('p1',t>.76?true:null);op('w1',seg(t,.86,.94));}});

/* 2 · embed & store */
S.push({kick:'Stage 2 of 6 · Embed & store · checked in the stored data',title:'Was the chunk stored with the right tags?',
 lead:'Each chunk is turned into numbers (an embedding) and stored with tags: machine, document type, revision. Search filters on those tags. If a chunk carries the wrong tag, it sits in the wrong drawer: a search for one machine returns another machine’s text, or finds nothing.',
 real:'Before a fix, shift-log rows were batched in file order, so one chunk could hold the welder’s, the furnace’s and the press’s events under a single machine tag. A search for one machine returned another machine’s events. Found and fixed; not counted in our tests. Like chunking, you check this in the stored data, not in the trace.',
 src:'embedder.py, chunk_csv (note on the shift-log fix)',dur:10000,
 build:()=>`${strip(1)}
  <g id="e1"><rect x="40" y="140" width="150" height="74" rx="6" fill="var(--paper)" stroke="var(--steel)" stroke-width="1.6"/>
   <text class="mb" x="52" y="160" style="font-size:9px">CHUNK 5</text>${[0,1,2].map(j=>`<rect x="52" y="${172+j*11}" width="${118-(j%2)*30}" height="3.5" rx="1.75" fill="var(--line)"/>`).join('')}</g>
  <g id="e2"><path d="M196,177 H262" stroke="var(--faint)" stroke-width="1.4" fill="none" marker-end="url(#ah)"/>
   <text class="m" x="229" y="168" text-anchor="middle" style="font-size:8.5px">EMBEDDING</text><text class="m" x="229" y="196" text-anchor="middle" style="font-size:8.5px">1,024 NUMBERS</text></g>
  <g id="e3"><rect x="270" y="120" width="190" height="200" rx="12" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.4"/>
   <text class="mb" x="284" y="142">VECTOR STORE</text><text class="m" x="284" y="156" style="font-size:8.5px">PINECONE</text>
   <rect x="284" y="168" width="162" height="138" rx="8" fill="var(--sunk)" stroke="var(--line)"/>
   <text class="m" x="296" y="188" style="font-size:8.5px">STORED ENTRY · TAGS</text>
   ${chip(296,212,'MACHINE: FL-101','pine',9)}${chip(296,238,'TYPE: WORK INSTRUCTION','steel',9)}${chip(296,264,'REVISION: 1.0','steel',9)}
   <g id="e3c"><circle cx="430" cy="288" r="9" fill="var(--pine)"/><text class="mb" x="430" y="292" text-anchor="middle" style="fill:var(--surface)">✓</text></g></g>

let cur=0,raf=0,t0=0,playing=false;const PAUSE=7000;
function show(i){cancelAnimationFrame(raf);cur=(i+S.length)%S.length;const s=S[cur];

  [...$('dots').children].forEach((d,k)=>d.classList.toggle('on',k===cur));

  playing=true;$('play').textContent='❚❚ Pause';loop();}
function loop(){const s=S[cur],e=performance.now()-t0;
